schema_version: "1.0"
monitors:
  - id: residuals
    type: residual
    thresholds: {continuity: 0.001, x-velocity: 0.001, y-velocity: 0.001, z-velocity: 0.001, energy: 0.000001}
    check_every: 1
  - id: mass-closure
    type: mass_balance
    inlets:
      type: names
      names: [fuel, oxy]
      cardinality: {exactly: 2}
    outlets:
      type: names
      names: [outlet]
      cardinality: {exactly: 1}
    check_every: 25
  - id: maximum-temperature
    type: volume_report
    operation: maximum
    field: temperature
    zones:
      type: zone_type
      zone_type: fluid
      cardinality: {at_least: 1}
    unit: K
    check_every: 25
  - id: torch-wall-temperature
    type: surface_report
    operation: maximum
    field: temperature
    zones:
      type: names
      names: [wall_fuel]
      cardinality: {exactly: 1}
    unit: K
    check_every: 25
  - id: combustor-wall-temperature
    type: surface_report
    operation: maximum
    field: temperature
    zones:
      type: names
      names: [wall_comb]
      cardinality: {exactly: 1}
    unit: K
    check_every: 25
  - id: torch-wall-shear
    type: surface_report
    operation: maximum
    field: wall-shear
    zones:
      type: names
      names: [wall_fuel]
      cardinality: {exactly: 1}
    unit: Pa
    check_every: 25
  - id: combustor-wall-shear
    type: surface_report
    operation: maximum
    field: wall-shear
    zones:
      type: names
      names: [wall_comb]
      cardinality: {exactly: 1}
    unit: Pa
    check_every: 25
gates:
  - id: final-data-written
    type: artifact_exists
    category: orchestration
    severity: required
    stage: final-checkpoint
    output: data-file
  - id: wall-metrics-written
    type: artifact_exists
    category: orchestration
    severity: required
    stage: sample-window-4
    output: wall-metrics
  - id: credible-reacting-temperature
    type: threshold
    category: scientific
    severity: required
    monitor: maximum-temperature
    operator: ge
    limit: {value: 3500, unit: K}
  - id: wall-temperature-window-stable
    type: steady_window
    category: scientific
    severity: advisory
    monitor: torch-wall-temperature
    samples: 3
    relative_span: 0.10
