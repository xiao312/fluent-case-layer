[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fluent-case-layer"
version = "0.1.0"
description = "Typed, staged, and auditable case orchestration for PyFluent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
fluent = ["ansys-fluent-core>=0.30"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
fluent-case = "fluent_case_layer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fluent_case_layer"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
