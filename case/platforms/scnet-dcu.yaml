schema_version: "1.0"
platform:
  id: scnet-dcu
  kind: slurm
  enabled: false
  hardware: dcu
  scheduler:
    partition: ${SCNET_DCU_PARTITION}
    account_variable: SCNET_SLURM_ACCOUNT
  resources:
    nodes: 1
    ranks: 1
    tasks_per_node: 1
    threads_per_rank: 1
    memory_per_node: {value: 64, unit: GiB}
    accelerators_per_node: 1
    walltime: {value: 1, unit: h}
    exclusive: true
  environment:
    setup_script_variable: SCNET_FLUENT_DCU_ENV
    python_environment_variable: SCNET_PYFLUENT_VENV
  fluent: {version: 2026R1, mode: solver, graphics: none}
  capabilities: [settings_api, postprocess, accelerator]
  notes:
    - Disabled until the Fluent release and selected physics are proven on DCU hardware.
