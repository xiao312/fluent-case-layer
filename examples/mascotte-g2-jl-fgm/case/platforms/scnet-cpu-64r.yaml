schema_version: "1.0"
platform:
  id: scnet-cpu-64r
  kind: slurm
  enabled: false
  hardware: cpu
  scheduler:
    partition: "${SCNET_CPU_PARTITION}"
    account_variable: SCNET_SLURM_ACCOUNT
  resources:
    nodes: 2
    ranks: 64
    tasks_per_node: 32
    threads_per_rank: 1
    memory_per_node: {value: 128, unit: GiB}
    accelerators_per_node: 0
    walltime: {value: 12, unit: h}
    exclusive: true
  environment:
    setup_script_variable: SCNET_FLUENT_2026_ENV
    python_environment_variable: SCNET_PYFLUENT_VENV
  fluent: {version: 2026R1, mode: solver, graphics: none}
  capabilities: [settings_api, tui, postprocess]
  notes:
    - Disabled; the 86,400-cell model has no retained 64-rank scaling qualification.
